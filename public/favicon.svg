<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Oceanic Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radar Sweep Glow Gradient -->
    <linearGradient id="sweepGrad" x1="20%" y1="90%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Glow for Station & Echo -->
    <filter id="beaconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.35"/>

  <!-- Radar Grid: Concentric Range Rings (240km network footprint) -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.45"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.32"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.28" stroke-dasharray="3.5 3.5"/>

  <!-- Crosshairs -->
  <line x1="14" y1="64" x2="114" y2="64" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="64" y1="14" x2="64" y2="114" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.22"/>

  <!-- Radar Sweep Beam (Pie Wedge) -->
  <path d="M 64 64 L 84 18.2 A 50 50 0 0 1 113.2 55.3 Z" fill="url(#sweepGrad)"/>
  <!-- Sweep Leading Edge Line (Phosphor Line) -->
  <line x1="64" y1="64" x2="113.2" y2="55.3" stroke="#f0f9ff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Weather Echo 1: Developing Convective Rain / Storm Cell (dBZ Color Scale) -->
  <!-- Layer 1: Cyan / Light Rain (15-25 dBZ) -->
  <path d="M 76 34 C 74 28, 86 20, 94 22 C 102 24, 106 32, 102 38 C 98 44, 88 46, 80 42 C 75 40, 78 36, 76 34 Z" fill="#00e5ff" opacity="0.95"/>
  <circle cx="102" cy="27" r="5" fill="#00e5ff" opacity="0.85"/>
  <circle cx="76" cy="42" r="4" fill="#00e5ff" opacity="0.85"/>

  <!-- Layer 2: Emerald Green / Moderate Rain (30-40 dBZ) -->
  <path d="M 80 32 C 80 26, 88 23, 94 25 C 100 27, 100 34, 96 37 C 92 41, 84 40, 81 37 Z" fill="#10b981"/>

  <!-- Layer 3: Vibrant Amber / Heavy Downpour (45-50 dBZ) -->
  <path d="M 84 31 C 85 27, 91 26, 94 28 C 97 30, 96 34, 93 36 C 89 38, 84 36, 84 31 Z" fill="#f59e0b"/>

  <!-- Layer 4: Crimson Severe Cell Core (55+ dBZ) -->
  <ellipse cx="90" cy="31" rx="3.8" ry="3.2" fill="#ef4444"/>

  <!-- Weather Echo 2: Light Shower Cell (South-West) -->
  <ellipse cx="44" cy="80" rx="9.5" ry="6.5" transform="rotate(-20 44 80)" fill="#00e5ff" opacity="0.9"/>
  <ellipse cx="44" cy="80" rx="5.5" ry="3.5" transform="rotate(-20 44 80)" fill="#10b981"/>

  <!-- Radar Station (Center Mast) with Warning Amber Pulse -->
  <circle cx="64" cy="64" r="9" fill="#f59e0b" opacity="0.35" filter="url(#beaconGlow)"/>
  <circle cx="64" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="64" r="2.2" fill="#ffffff"/>
</svg>

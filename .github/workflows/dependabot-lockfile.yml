# Regenerate package-lock.json on Dependabot PRs so `npm ci` in CI passes.
# Dependabot bumps package.json but may produce an out-of-sync lockfile
# (missing transitive deps) that causes `npm ci` to fail with EUSAGE.
name: Dependabot lockfile fix

on: pull_request

permissions:
  contents: write       # push the updated lockfile
  pull-requests: write  # needed for gh pr checkout

jobs:
  lockfile:
    name: Regenerate lockfile
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # Use a PAT or the default token with write perms to push back.
          # fetch-depth 0 so we can push to the PR branch.
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          # Only commit if the lockfile actually changed
          if git diff --cached --quiet; then
            echo "Lockfile already in sync — nothing to commit."
          else
            git commit -m "chore(deps): regenerate package-lock.json"
            git push
          fi
